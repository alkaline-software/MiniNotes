[package]
name = "onyx-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary's name is what macOS shows in the menu bar and the Dock for a bare binary.
[[bin]]
name = "Onyx"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
onyx-core = { path = "../onyx-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The zed revision is pinned in Cargo.lock (cargo update -p gpui --precise <rev>).
# gpui-component depends on the unpinned zed source, so a `rev` here would
# make a second copy of gpui that it does not build against.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
# The window's text selection layer, to end a drag a swallowed click would leave open.
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
# The icons and the app's own pictures, built into the binary.
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
# Open a file or a link with the system's own app, without shelling out.
opener = "0.7"
# The system's preferred languages, for the window's (`i18n::pick`).
sys-locale = "0.3"
# Markdown read for the live preview: every span with where it stands in the text.
pulldown-cmark = { version = "0.13", default-features = false }
# A caret steps by grapheme, not by byte or by char.
unicode-segmentation = "1"
# The hour, for the vault page's greeting.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The account's name, for the greeting.
whoami = "1"

[target.'cfg(windows)'.dependencies]
# Velopack's installer runs the app with a hook to answer at start (`main`).
velopack = "=1.2.161"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
ropey = "2.0.0-beta.1"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSApplication", "NSImage", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSArray", "NSDictionary", "NSUserDefaults", "NSBundle", "NSFileManager", "NSURL"] }
raw-window-handle = "0.6"

# Installers: `cargo packager --release` (cargo-packager) wraps the app for
# Linux and is the bundle's base on macOS. release.yml passes `--formats`
# per system and renames the results to the stable names. No signing
# identity is set here: the macOS bundle is signed afterwards by
# scripts/release-mac.sh, and Windows is packed and signed by Velopack.
[package.metadata.packager]
productName = "Onyx"
authors = ["Alkaline Software"]
publisher = "Alkaline Software"
identifier = "com.alkalinesoftware.onyx"
description = "A sample app built to the Alkaline Software constitution."
longDescription = "Onyx is the template every Alkaline Software app begins from: the window, the settings, the motion and the release, ready to be renamed."
homepage = "https://github.com/alkaline-software/onyx"
licenseFile = "../../LICENSE"
category = "DeveloperTool"
icons = ["assets/icon/icon.icns", "assets/icon/icon.ico", "assets/icon/icon-*.png"]
outDir = "../../dist"
binaries = [{ path = "Onyx", main = true }]

[package.metadata.packager.macos]
minimumSystemVersion = "14.0"
# Merged into the bundle's Info.plist: the languages the window speaks,
# so System Settings, Language & Region, Applications offers each.
infoPlistPath = "macos/Info.plist"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libvulkan1", "libfontconfig1", "libfreetype6", "libx11-xcb1", "libxcb1"]

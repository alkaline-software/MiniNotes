name: release

# Installers, built only when a version tag is pushed (`git tag v0.2.0 &&
# git push --tags`). Each OS packages its own build (cargo-packager on
# macOS and Linux, Velopack on Windows) and the files are attached to a
# draft GitHub Release under stable names, so a site can link
# `releases/latest/download/<name>` and never go stale. The release's notes
# are the tag's section of CHANGELOG.md.
#
# Only the Mac is published, so the matrix has only its rows. The steps for
# Windows and Linux stay: a row for each is all they need to run again.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac builds come from the ARM runner, the Intel one
          # cross-compiled: the Intel runners are slow and few.
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
            asset: Onyx-mac-arm64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
            asset: Onyx-mac-x64.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Whether a secret is set, as a word a step's `if` can read: a step
      # sees no secret there, and an empty one means a fork or a repository
      # not yet set up, which still gets unsigned installers.
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && 'yes' || '' }}
      SNAP_UPLOAD: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' && vars.SNAP_CHANNEL != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the workspace version and has release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Cargo.toml says $v but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
          scripts/release-notes.sh "$v" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Everything gpui links against on Linux, and what the AppImage and
      # the snap are packed with (FUSE's library, file, squashfs).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers libasound2-dev \
            libfuse2 file squashfs-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo-packager
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Velopack makes the Windows installer: Setup.exe shows the splash
      # (scripts/splash/) while it puts Onyx in place, then opens it,
      # and an app that links the `velopack` crate updates itself from the
      # feed packed beside it. vpk and the crate are pinned to one version
      # and move together.
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: "9.0.x"
      - name: vpk
        if: runner.os == 'Windows'
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Build
        run: cargo build --release --locked -p onyx-app --target ${{ matrix.target }}

      - name: Package
        if: runner.os == 'Linux'
        run: cargo packager --release -p onyx-app --target ${{ matrix.target }} --formats ${{ matrix.formats }}
        env:
          # linuxdeploy is an AppImage itself; runners have no FUSE for it.
          APPIMAGE_EXTRACT_AND_RUN: 1

      # With Azure Artifact Signing's secrets in the repository, vpk signs
      # Onyx.exe, Velopack's own programs and Setup.exe with the account's
      # certificate (signtool and Azure's library, which vpk carries; the
      # sign-in is the service principal's, read from the environment).
      # Without them the installer is unsigned and SmartScreen stops it.
      # The feed and the package go up with the installer: an updater reads
      # `releases.<rid>.json` from the latest release.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/Onyx.exe" pack/
          $sign = @()
          if ($env:AZURE_CLIENT_ID -and $env:SIGN_ACCOUNT) {
            @{ Endpoint = $env:SIGN_ENDPOINT; CodeSigningAccountName = $env:SIGN_ACCOUNT; CertificateProfileName = $env:SIGN_PROFILE } | ConvertTo-Json | Set-Content metadata.json
            $sign = @('--azureTrustedSignFile', 'metadata.json')
          }
          vpk pack --packId AlkalineSoftware.Onyx --packVersion $version --packDir pack --mainExe Onyx.exe `
            --packTitle Onyx --packAuthors "Alkaline Software" `
            --icon crates/onyx-app/assets/icon/icon.ico `
            --splashImage scripts/splash/splash.png --splashProgressColor "#5061B3" `
            --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --noPortable `
            --outputDir velopack @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem velopack

      # The Microsoft Store's package, once Partner Center has reserved the
      # app's identity (the repository's STORE_* variables): an .msix the
      # Store signs, kept with the run for uploading to Partner Center and
      # not put on the release, where nothing could install it unsigned.
      - name: Store package (Windows)
        if: runner.os == 'Windows' && vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != ''
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $arch = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          New-Item -ItemType Directory -Force store | Out-Null
          scripts/windows-msix.ps1 -Exe "target/${{ matrix.target }}/release/Onyx.exe" -Version $version -Arch $arch `
            -Name '${{ vars.STORE_IDENTITY_NAME }}' -Publisher '${{ vars.STORE_PUBLISHER }}' -PublisherName '${{ vars.STORE_PUBLISHER_NAME }}' `
            -Out "store/Onyx-windows-$arch.msix"

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != ''
        with:
          name: store-${{ matrix.rid }}
          path: store/*

      # With the certificate in the repository's secrets the bundle gets a
      # Developer ID signature, the hardened runtime, and, with the Apple ID
      # secrets too, notarization and a staple: a plain double-click install.
      # Without them (a fork, a contributor) the build is ad-hoc signed, and
      # the signer's Mac puts notarized images over it before the draft is
      # published (scripts/release-publish.sh). scripts/release-mac.sh is the
      # same script a laptop release uses; it finds the identity in the
      # keychain made here.
      - name: Signing identity (when the secrets are set)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'yes'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "ONYX_SIGNED=1" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${ONYX_SIGNED:-}" = "1" ]; then
            NOTARIZE=""; [ -n "$APPLE_ID" ] && NOTARIZE="--notarize"
            scripts/release-mac.sh --target ${{ matrix.target }} --no-build $NOTARIZE --out dist/${{ matrix.asset }}
          else
            scripts/release-mac.sh --target ${{ matrix.target }} --no-build --identity - --out dist/${{ matrix.asset }}
          fi

      - name: Stable file names
        shell: bash
        run: |
          mkdir -p upload
          case "${{ matrix.formats }}" in
            dmg)   mv dist/*.dmg "upload/${{ matrix.asset }}" ;;
            velopack)
                   mv velopack/*-Setup.exe "upload/${{ matrix.asset }}"
                   mv velopack/*.nupkg velopack/releases.*.json upload/ ;;
            appimage,deb)
                   mv dist/*.AppImage "upload/${{ matrix.asset }}"
                   mv dist/*.deb "upload/$(basename "${{ matrix.asset }}" .AppImage).deb" ;;
          esac
          ls -la upload

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: upload/*

      # The Snap Store's package, from the same binary as the .deb
      # (scripts/linux-snap.sh), kept with the run and not put on the
      # release: a snap from a file installs only with --dangerous. Once
      # the store has the name and has granted classic confinement, and
      # the repository has SNAPCRAFT_STORE_CREDENTIALS and SNAP_CHANNEL,
      # it is uploaded and released to that channel; App Center installs
      # it from there with no warning, and snapd keeps it current.
      - name: Snap package (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v snap >/dev/null || sudo apt-get install -y --no-install-recommends snapd
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          scripts/linux-snap.sh target/${{ matrix.target }}/release/Onyx "$v" ${{ matrix.snap }} snap/onyx_${{ matrix.snap }}.snap

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: snap-${{ matrix.snap }}
          path: snap/*

      - name: Snap Store
        if: runner.os == 'Linux' && env.SNAP_UPLOAD == 'yes' && startsWith(github.ref, 'refs/tags/')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload --release=${{ vars.SNAP_CHANNEL }} snap/onyx_${{ matrix.snap }}.snap

  # One release, made once the builds are in, with the tag's section of
  # CHANGELOG.md as its notes. Each package job making the release itself
  # leaves a copy of an auto-generated changelog on the page per job.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: upload
          pattern: Onyx-*
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          ls -la upload

      - uses: softprops/action-gh-release@v3
        with:
          name: Onyx ${{ github.ref_name }}
          body_path: notes.md
          files: upload/*
          # A draft until scripts/release-publish.sh has put the notarized
          # Mac images over the ad-hoc ones built here. Published at once,
          # the page and an updater would hand out images macOS refuses for
          # as long as the upload was not done.
          draft: true
